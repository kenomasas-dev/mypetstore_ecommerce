                    <i class="fas fa-box me-2"></i> Products
                </a>
                <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                    <li><a class="dropdown-item" href="addproduct.html">Add Product</a></li>

            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="ordersDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">

    <div id="addProductForm" class="hidden">
        <div id="content">
            <h2>Product</h2>
            <div class="form-container">
                <h3>Add New Product</h3>
                <form id="productForm">
                    <div class="form-group">
                        <label for="productName">Product Name:</label>
                        <input type="text" id="productName" name="productName" placeholder="Enter product name">
                    </div>
                    <div class="form-group">
                        <label for="productDescription">Description:</label>
                        <textarea id="productDescription" name="productDescription" rows="4" placeholder="Enter product description"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="productImage">Product Image:</label>
                        <input type="file" id="productImage" name="productImage" accept="image/*">
                    </div>
                    <button type="submit" class="btn btn-primary">Add Product</button>
                </form>
            </div>
        </div>
    </div>
    

      
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('productForm').addEventListener('submit', function(event) {
    event.preventDefault(); // Prevent the default form submission

    const productName = document.getElementById('productName').value;
    const productDescription = document.getElementById('productDescription').value;
    const productImage = document.getElementById('productImage').files[0];

    if (productImage) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const imageURL = event.target.result; // This is the data:image/... URL

            // Create a new row for the table
            const newRow = document.createElement('tr');

            // Add the image cell
            const imageCell = document.createElement('td');
            const img = document.createElement('img');
            img.src = imageURL;
            img.alt = productName;
            img.style.maxWidth = '100px';
            img.style.maxHeight = '100px';
            imageCell.appendChild(img);
            newRow.appendChild(imageCell);

            // Add the product name cell
            const nameCell = document.createElement('td');
            nameCell.textContent = productName;
            newRow.appendChild(nameCell);

            // Add the product description cell
            const descriptionCell = document.createElement('td');
            descriptionCell.textContent = productDescription;
            newRow.appendChild(descriptionCell);

            // Append the new row to the table body
            document.getElementById('productTableBody').appendChild(newRow);

        };
        reader.readAsDataURL(productImage); // Read the image as a data URL
    }
});
</script>
</body>
</html>

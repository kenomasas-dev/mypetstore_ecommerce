    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            animation: fadeIn 0.8s ease-in-out;
        }
        .card {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }
        .btn-primary {
            transition: all 0.3s ease-in-out;
        }
        .btn-primary:hover {
            transform: scale(1.05);
            background-color: #007bff;
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        input {
            transition: all 0.3s ease-in-out;
        }
        input:focus {
            border-color: #007bff;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.3);
        }
    </style>
</head>
<body>
    <div id="sidebar"style="margin-top: -24px;">
        <div class="text-center py-3">
            <img src="mypetstorelogo.png" alt="Logo" width="80" height="80">
            <h5 class="mt-2">Staff Panel</h5>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" href="staffviewproduct.html">
                    <i class="fas fa-box me-2"></i>Products
                </a>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="ordersDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="fas fa-shopping-cart me-2"></i> Orders
                </a>
                <ul class="dropdown-menu" aria-labelledby="ordersDropdown">
                    <li><a class="dropdown-item" href="staffvieworders.php">View Orders</a></li>
                    <li><a class="dropdown-item" href="staffrecentorders.php">Recent Orders</a></li>
                </ul>
            </li> 
            <li class="nav-item">
                <a class="nav-link active" href="settings.html"><i class="fa fa-cog"></i> Settings</a>
            </li>

    <div class="container mt-4" style="max-width: 600px;">
        <h2 class="text-center">Staff Information</h2>
        <div class="card p-4" id="staff-info">
            <p class="text-muted">Loading staff information...</p>
            <button class="btn btn-primary mt-3 w-100" id="edit-btn">Edit</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch("get_staff_info.php")
                .then(response => response.json())
                .then(data => {
                    let staffInfoDiv = document.getElementById("staff-info");
                    if (data.status === "success") {
                        staffInfoDiv.innerHTML = `
                            <p><strong>First Name:</strong> <span id="first-name">${data.first_name}</span></p>
                            <p><strong>Last Name:</strong> <span id="last-name">${data.last_name}</span></p>
                            <p><strong>Email:</strong> <span id="email">${data.email}</span></p>
                            <p><strong>Phone:</strong> <span id="phone">${data.phone}</span></p>
                            <p><strong>Role:</strong> <span id="role">${data.role}</span></p>
                            <button class="btn btn-primary mt-3 w-100" id="edit-btn">Edit</button>
                        `;
                    } else {
                        staffInfoDiv.innerHTML = `<p class="text-danger">${data.message}</p>`;
                    }
                })
                .catch(error => {
                    document.getElementById("staff-info").innerHTML = "<p class='text-danger'>Error loading staff information.</p>";
                });

            document.addEventListener("click", function(event) {
                if (event.target && event.target.id === "edit-btn") {
                    let staffInfoDiv = document.getElementById("staff-info");
                    staffInfoDiv.innerHTML = `
                        <p><strong>First Name:</strong> <input type="text" class="form-control" id="edit-first-name" value="${document.getElementById('first-name')?.innerText || ''}"></p>
                        <p><strong>Last Name:</strong> <input type="text" class="form-control" id="edit-last-name" value="${document.getElementById('last-name')?.innerText || ''}"></p>
                        <p><strong>Email:</strong> <input type="email" class="form-control" id="edit-email" value="${document.getElementById('email')?.innerText || ''}"></p>
                        <p><strong>Phone:</strong> <input type="text" class="form-control" id="edit-phone" value="${document.getElementById('phone')?.innerText || ''}"></p>
                        <p><strong>Role:</strong> <input type="text" class="form-control" id="edit-role" value="${document.getElementById('role')?.innerText || ''}"></p>
                        <button class="btn btn-success mt-3 w-100" id="save-btn">Save</button>
                    `;

                    document.getElementById("save-btn").addEventListener("click", function() {
                        let updatedData = {
                            first_name: document.getElementById("edit-first-name").value,
                            last_name: document.getElementById("edit-last-name").value,
                            email: document.getElementById("edit-email").value,
                            phone: document.getElementById("edit-phone").value,
                            role: document.getElementById("edit-role").value
                        };

                        fetch("update_staff_info.php", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(updatedData)
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (data.status === "success") {
                                alert("Staff information updated successfully!");
                                location.reload();
                            } else {
                                alert("Error: " + data.message);
                            }
                        })
                        .catch(error => {
                            alert("Error updating staff information.");
                        });
                    });
                }
            });
        });
    </script>
</body>

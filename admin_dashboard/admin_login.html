<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: url('https://source.unsplash.com/1600x900/?pets') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            max-width: 400px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .btn-primary {
            background: #ff7b00;
            border-color: #ff7b00;
            border-radius: 8px;
            font-size: 18px;
            transition: 0.3s;
        }
        .btn-primary:hover {
            background: #e66a00;
            border-color: #e66a00;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Admin Login</h2>
        <form id="admin-login-form">
            <div class="mb-3">
                <input type="text" class="form-control" id="admin-username" placeholder="Enter username">
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="admin-password" placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
    </div>

    <script>
        document.getElementById('admin-login-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const username = document.getElementById('admin-username').value.trim();
            const password = document.getElementById('admin-password').value.trim();
            login(username, password);
        });
        
        function login(username, password) {
            fetch('admin_login.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ username: username, password: password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    alert("Login Successfully, Welcome Admin.");
                    window.location.href = "admin.html";
                } else {
                    alert("Invalid credentials. Please try again.");
                }
            })
            .catch(error => {
                console.error("Error:", error);
                alert("An error occurred. Please try again later.");
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Store Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: url('https://source.unsplash.com/1600x900/?pet,store') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            max-width: 400px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .login-container h2 {
            font-family: 'Poppins', sans-serif;
            color: #333;
            margin-bottom: 20px;
        }
        .form-control {
            border-radius: 8px;
        }
        .form-control:focus {
            border-color: #ff7b00;
            box-shadow: 0 0 5px rgba(255, 123, 0, 0.5);
        }
        .btn-primary {
            background: #ff7b00;
            border-color: #ff7b00;
            border-radius: 8px;
            font-size: 18px;
            transition: 0.3s;
        }
        .btn-primary:hover {
            background: #e66a00;
            border-color: #e66a00;
        }
        .forgot-password a {
            color: #ff7b00;
            text-decoration: none;
            font-weight: 500;
        }
        .forgot-password a:hover {
            text-decoration: underline;
        }
        .pet-logo {
            font-size: 40px;
            color: #ff7b00;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="login-container">
       
        <h2>User Login</h2>
        <form id="user-login-form">
            <div class="mb-3">
                <input type="text" class="form-control" id="user-identifier" placeholder="Enter your email or phone number">
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="user-password" placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <div class="forgot-password mt-3">
            <a href="#">Forgot password?</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('user-login-form').addEventListener('submit', function (event) {
                event.preventDefault();
                const email = document.getElementById('user-identifier').value.trim();
                const password = document.getElementById('user-password').value.trim();
                login(email, password);
            });
            function login(email, password) {
                fetch('login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ email: email, password: password })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        localStorage.setItem('loggedInUser', data.email);
                        alert("Login Successfully, Welcome.");
                        window.location.href = "staffviewproduct.html";
                    } else {
                        alert("Invalid credentials. Please try again.");
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("An error occurred. Please try again later.");
                });
            }
        });
    </script>
</body>
</html>

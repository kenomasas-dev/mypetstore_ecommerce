<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css"> <!-- Updated path -->
</head>
<body>

    <div id="sidebar">
        <div class="text-center py-3">
            <img src="mypetstorelogo.png" alt="Logo" width="80" height="80">
            <h5 class="mt-2">Admin Panel</h5>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" href="admin.html"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="fas fa-box me-2"></i> Products
                </a>
                <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                    <li><a class="dropdown-item" href="addproduct.html">Add Product</a></li>
                    <li><a class="dropdown-item" href="viewproduct.html">View Product</a></li>
                </ul>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="ordersDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="fas fa-shopping-cart me-2"></i> Orders
                </a>
                <ul class="dropdown-menu" aria-labelledby="ordersDropdown">
                  
                    <li><a class="dropdown-item" href="recentorders.html">Recent Orders</a></li>
                </ul>
            </li>            
        
            <li class="nav-item">
                <a class="nav-link" href="reports.html"><i class="fas fa-file-alt"></i> Reports</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="managestaff.html"><i class="fas fa-user-tie me-2"></i> Manage Staff</a> <!-- Updated path -->
            </li>
            <li class="nav-item">
                <a class="nav-link" href="login.html"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
            </li>
        </ul>
    </div>

    <div id="content">
        <div class="container mt-4">
            <h3 class="text-center mb-4">Order Management</h3>
    
            <div class="card shadow-lg p-3">
                <div class="table-responsive">
                    <table class="table table-striped table-bordered">
                        <thead class="table-dark">
                            <tr>
                                <th>Order ID</th>
                                <th>Customer Name</th>
                                <th>Product</th>
                                <th>Quantity</th>
                                <th>Total Price</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>#001</td>
                                <td>Juan Dela Cruz</td>
                                <td>Dog Food</td>
                                <td>2</td>
                                <td>₱800.00</td>
                                <td><span class="badge bg-warning">Pending</span></td>
                                <td>
                                    <button class="btn btn-primary btn-sm">View</button>
                                    <button class="btn btn-success btn-sm">Update</button>
                                    <button class="btn btn-danger btn-sm">Delete</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
